# AI Data Firewall Example Configuration (TOML)
# ==============================================================================
# Security Defaults:
# - Strictly binds to 127.0.0.1 by default (prevents LAN exposure)
# - Fixed upstream URL (cannot be altered by client requests)
# - No arbitrary remote execution, no telemetry, no persistent databases
# ==============================================================================

[proxy]
# Local network interface to bind (default: 127.0.0.1)
host = "127.0.0.1"

# Local port to bind (default: 8080)
port = 8080

# Target upstream AI server URL (REQUIRED)
# Safe examples:
#   Local Ollama:        "http://127.0.0.1:11434"
#   Test endpoint:       "https://example.invalid"
#   OpenAI-compatible:   "https://example.invalid/v1"
upstream_url = "http://127.0.0.1:11434"

# Provider adapter name: "openai", "anthropic", "gemini", or "ollama"
provider = "ollama"

# Upstream timeouts in seconds
connect_timeout = 5.0
read_timeout = 30.0
write_timeout = 10.0
total_timeout = 60.0

# Body size limits (in bytes)
max_request_body_bytes = 5242880    # 5 MB
max_response_body_bytes = 10485760  # 10 MB

[policy]
# Default action when no rules match: "allow", "warn", "redact", or "block"
default_action = "allow"

# Optional built-in preset: "redact-secrets", "block-secrets", "warn-secrets", or "allow-all"
preset = "redact-secrets"

# Custom declarative policy rules (evaluated in priority order)
[[policy.rules]]
rule_id = "block-critical-secrets"
action = "block"
category = "secret"
minimum_severity = "critical"
minimum_confidence = 0.8
description = "Block any request or response with high-confidence critical secrets"

[[policy.rules]]
rule_id = "redact-high-secrets"
action = "redact"
category = "secret"
minimum_severity = "high"
minimum_confidence = 0.7
description = "Mask high-severity secrets before forwarding or returning"
