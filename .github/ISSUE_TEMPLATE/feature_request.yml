name: Feature Request
description: Suggest an idea or proposal for AI Data Firewall
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement! Please do NOT include real API keys, passwords, personal identifiable information (PII), or confidential data in this request.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or use case?
      placeholder: "I encounter an issue when trying to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
      placeholder: "Describe how the capability or feature should work..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches
      description: Describe any alternative solutions or workarounds you've considered.
      placeholder: "Alternative approaches considered..."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, diagrams, or references about the feature request here.
    validations:
      required: false
