[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-firewall"
version = "0.1.0"
description = "An open-source, local-first security layer for AI applications."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "AI Data Firewall Contributors" }
]
keywords = [
    "ai-security",
    "llm-security",
    "privacy",
    "secrets-detection",
    "prompt-injection",
    "local-first",
    "ai-firewall"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
]

[project.scripts]
aifirewall = "aifirewall.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0"
]

[project.urls]
Homepage = "https://github.com/AyushBhushan45/ai-data-firewall"
Documentation = "https://github.com/AyushBhushan45/ai-data-firewall#readme"
Issues = "https://github.com/AyushBhushan45/ai-data-firewall/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

